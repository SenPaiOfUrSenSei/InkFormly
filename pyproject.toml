[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inkform"
version = "0.1.0"
description = "Local neural handwriting synthesis with independent ink rendering"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.6,<3", "numpy>=2,<3", "pillow>=11,<14",
  "pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "reportlab>=4.4,<5",
  "transformers==4.57.6", "sentencepiece>=0.2,<0.3", "safetensors>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pypdf>=5,<7"]
research = ["scipy>=1.15,<2"]

[project.scripts]
inkform = "inkform.__main__:main"

[tool.setuptools.packages.find]
include = ["inkform*", "vendor.graves*"]
namespaces = true

[tool.setuptools.package-data]
inkform = ["static/*", "assets/*.json"]
"vendor.graves" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: exercises the downloaded pretrained checkpoint"]
filterwarnings = ["ignore:.*torch.jit.*:FutureWarning"]
